name: Production Release

# Publishing is disabled until Phase 4 (AppImage/.deb): pushes only run the
# Linux build check and upload the tarball as a workflow artifact.
# To re-enable releases, revert the commit that added this comment (restores
# the releasable-commit check, the semantic-release job and write permissions).

on:
  push:
    branches:
      - main

# Queue rather than cancel: once Phase 4 restores the semantic-release
# job, cancelling an in-progress run here could interrupt a publish
# mid-flight (tag created, assets not uploaded). Do not flip this to
# true without also confirming the release job is still disabled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-linux.yml
    with:
      artifact-name: linuxshot-linux
